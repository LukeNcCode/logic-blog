<title>裸机思维 · RawLogic</title>
<link rel="stylesheet" href="fonts/noto-400.css">
<link rel="stylesheet" href="fonts/noto-700.css">
<style>
  /* ===== SF Pro Text 本地字体（西文/数字），中文回退系统苹方 ===== */
  @font-face { font-family:"SF Pro Text"; src:url("fonts/SF-Pro-Text-Regular.otf") format("opentype"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"SF Pro Text"; src:url("fonts/SF-Pro-Text-Medium.otf") format("opentype"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:"SF Pro Text"; src:url("fonts/SF-Pro-Text-Semibold.otf") format("opentype"); font-weight:600; font-style:normal; font-display:swap; }
  @font-face { font-family:"SF Pro Text"; src:url("fonts/SF-Pro-Text-Bold.otf") format("opentype"); font-weight:700; font-style:normal; font-display:swap; }
  /* 代码字体已移至外部样式表 assets/blog.css（base64 内嵌，file:// 下同样可加载） */
  /* ===== 主题与基础 ===== */
  :root {
    --bg:#ffffff; --bg-soft:#f7f8fa; --ink:#1a1a1a; --muted:#5c5c5c;
    --accent:#1f3a5f; --accent-soft:#e8eef6; --line:#e5e7eb;
    --radius:16px; --shadow:0 10px 30px rgba(26,26,26,.08);
    /* 扩展配色变量（供暗夜主题覆盖） */
    --inverse:#1a1a1a; --inverse-hover:#000; --inverse-text:#fff;
    --card:#ffffff; --card-shadow:0 10px 30px rgba(26,26,26,.08);
    --code-bg:#0f172a; --code-text:#e2e8f0; --code-muted:#64748b;
    --code-key:#c792ea; --code-str:#a5d6a7; --code-cmt:#64748b; --code-num:#f78c6c; --code-pre:#82aaff;
    --overlay:rgba(26,26,26,.4); --modal-bg:#fff;
    --danger:#b3261e; --danger-soft:#fdecea;
    --ok:#1e7e4a; --ok-soft:#e6f4ea;
    --warn:#8a6d1e; --warn-soft:#f3f0e6;
  }
  /* 暗夜主题 */
  html[data-theme="dark"] {
    --bg:#121419; --bg-soft:#1b1e26; --ink:#e6e8ee; --muted:#9aa0ab;
    --accent:#5b8def; --accent-soft:#22304a; --line:#2a2e3a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --inverse:#e6e8ee; --inverse-hover:#fff; --inverse-text:#121419;
    --card:#191c24; --card-shadow:0 10px 30px rgba(0,0,0,.5);
    --overlay:rgba(0,0,0,.6); --modal-bg:#1b1e26;
    --danger:#e0605a; --danger-soft:#3a2525;
    --ok:#4caf7d; --ok-soft:#223a2d;
    --warn:#d4a94e; --warn-soft:#3a3322;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    /* 西文走本地 SF Pro Text；中文走本地 Noto Sans SC（思源黑体，苹方风开源替代），不依赖系统字体 */
    font-family:"SF Pro Text", "Noto Sans SC", -apple-system, BlinkMacSystemFont,
      "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    line-height:1.7;
  }
  a { color:inherit; text-decoration:none; }
  .container { max-width:1120px; margin:0 auto; padding:0 28px; }

  /* ===== 顶栏：毛玻璃 + 滚动阴影 ===== */
  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid transparent;
    transition:border-color .3s ease, box-shadow .3s ease, transform .3s ease;
  }
  .topbar.scrolled { border-bottom-color:var(--line); box-shadow:0 4px 20px rgba(26,26,26,.06); }
  .topbar.hidden { transform:translateY(-100%); }  /* 下滑隐藏、上滑显示 */
  .brand { font-weight:700; letter-spacing:-.01em; font-size:17px; }
  .brand span { color:var(--accent); }
  .nav { display:flex; gap:6px; }
  .nav a {
    padding:7px 16px; border-radius:999px; font-size:14px; font-weight:500; color:var(--muted);
    transition:background-color .18s ease, color .18s ease;
  }
  .nav a:hover { background:var(--accent-soft); color:var(--accent); }
  .nav a.active { background:var(--inverse); color:var(--inverse-text); }

  /* ===== 通用：渐入系统 [data-reveal] ===== */
  [data-reveal] {
    opacity:0; transform:translateY(22px); filter:blur(6px);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.3,1), filter .7s ease;
    transition-delay:var(--reveal-delay, 0ms);
  }
  [data-reveal].revealed { opacity:1; transform:none; filter:none; }

  /* ===== 欢迎页 ===== */
  .hero {
    position:relative; min-height:100vh;
    display:flex; align-items:center; overflow:hidden;
  }
  .hero-canvas-wrap {
    position:absolute; inset:0; z-index:0;
    -webkit-mask:linear-gradient(#000000fc 0%, #000000e8 10%, transparent 100%);
    mask:linear-gradient(#000000fc 0%, #000000e8 10%, transparent 100%);
  }
  .hero-canvas-wrap canvas { position:absolute; inset:0; width:100%; height:100%; }
  /* 鼠标光晕：CSS 变量跟随鼠标，径向渐变光斑 */
  .hero-glow {
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(520px circle at var(--gx,50%) var(--gy,40%), rgba(31,58,95,.10), transparent 65%);
    transition:background .08s linear;
  }
  .hero-content {
    position:relative; z-index:10;
    display:flex; flex-direction:column; gap:22px;
  }
  @keyframes ds-hero-enter {
    0% { opacity:0; transform:translateY(var(--enter-y,20px)); filter:blur(var(--enter-blur,0)); }
    100% { opacity:1; transform:translateY(0); filter:blur(0); }
  }
  .ds-hero-enter { animation:ds-hero-enter .8s ease-out backwards; }
  .hero-label { font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .hero h1 { font-size:clamp(44px,7vw,84px); line-height:1.12; letter-spacing:-.02em; }
  .hero-desc { max-width:600px; font-size:17px; color:var(--muted); }
  .hero-cta { display:flex; flex-wrap:wrap; gap:14px; }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 26px; border-radius:999px; border:none; cursor:pointer;
    font-size:15px; font-weight:600;
    transition:transform .18s ease, box-shadow .18s ease, background-color .18s ease;
  }
  .btn:hover { transform:translateY(-2px); }
  .btn:active, .lang-toggle:active { transform:scale(.96); }
  .btn-primary { background:var(--inverse); color:var(--inverse-text); box-shadow:0 6px 18px rgba(26,26,26,.18); }
  .btn-primary:hover { box-shadow:0 10px 26px rgba(26,26,26,.26); }
  .btn-ghost { border:1.5px solid var(--line); color:var(--ink); background:transparent; }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
  /* 滚动提示箭头：SVG 描边动画 */
  .hero-scroll-hint {
    position:absolute; left:50%; bottom:34px; transform:translateX(-50%); z-index:10;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--muted); font-size:12px; letter-spacing:.12em;
  }
  .hero-scroll-hint svg { width:22px; height:22px; }
  .arrow-sweep { stroke-dasharray:20; animation:arrow-sweep 1.6s ease-out infinite; }
  @keyframes arrow-sweep { 0% { stroke-dashoffset:20; } 100% { stroke-dashoffset:0; } }

  /* ===== 文章列表 ===== */
  .page { padding:120px 0 80px; min-height:100vh; }
  .page-head { margin-bottom:40px; }
  .page-head h2 { font-size:clamp(30px,4vw,44px); letter-spacing:-.02em; }
  .page-head p { color:var(--muted); margin-top:8px; }
  /* 标签筛选栏 */
  .tag-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .tag-pill {
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:6px 15px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:inherit;
    transition:border-color .18s ease, color .18s ease, background-color .18s ease, transform .18s ease;
  }
  .tag-pill:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .tag-pill.active { background:var(--accent); border-color:var(--accent); color:var(--inverse-text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:24px; }
  .card {
    position:relative; overflow:hidden;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; cursor:pointer;
    transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s ease, border-color .28s ease;
  }
  .card:hover { transform:translateY(-5px); box-shadow:var(--shadow); border-color:#cfd6df; }
  .card::before {  /* rotating-border：渐变描边在 hover 时旋转 */
    content:""; position:absolute; inset:0; border-radius:var(--radius); padding:1.5px;
    background:conic-gradient(from var(--border-angle,0deg), transparent 0 70%, var(--accent) 85%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .3s ease;
  }
  .card:hover::before { opacity:1; animation:rotating-border 3s linear infinite; }
  @keyframes rotating-border { to { --border-angle:360deg; } }
  @property --border-angle { syntax:"<angle>"; inherits:true; initial-value:0deg; }
  .card-tags { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tag {
    font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent);
  }
  button.tag { border:none; cursor:pointer; font-family:inherit; transition:filter .15s ease, transform .15s ease; }
  button.tag:hover { filter:brightness(.94); transform:translateY(-1px); }
  .card h3 { font-size:20px; line-height:1.4; letter-spacing:-.01em; transition:color .2s ease; }
  .card:hover h3 { color:var(--accent); }
  .card-summary { color:var(--muted); font-size:14.5px; margin-top:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-meta { display:flex; gap:14px; margin-top:16px; font-size:12.5px; color:var(--muted); }
  /* 卡片 hover：阅读箭头滑入 */
  .card-foot { margin-top:16px; display:flex; }
  .read-more {
    font-size:13px; font-weight:600; color:var(--accent);
    opacity:0; transform:translateX(-8px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .card:hover .read-more { opacity:1; transform:none; }



  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 0; }

  /* ===== 文章详情 ===== */
  .progress-bar {
    position:fixed; top:0; left:0; right:0; z-index:200; height:3px;
    background:var(--accent); transform-origin:left; transform:scaleX(0);
  }
  .article { max-width:940px; margin:0 auto; padding:140px 28px 100px; }
  .article-back {
    display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:14px;
    transition:color .18s ease, transform .18s ease;
  }
  .article-back:hover { color:var(--accent); transform:translateX(-3px); }
  .article h1 { font-size:clamp(30px,4.5vw,46px); line-height:1.25; letter-spacing:-.02em; margin:18px 0 14px; position:relative; padding-bottom:16px; animation:article-in .7s ease-out backwards; }
  /* 标题强调线：入场后从左展开 */
  .article h1::after {
    content:""; position:absolute; left:0; bottom:0;
    width:0; height:3px; border-radius:2px;
    background:linear-gradient(90deg, var(--accent), #4a7bb5);
    animation:underline-grow .7s cubic-bezier(.2,.7,.3,1) .5s forwards;
  }
  @keyframes underline-grow { to { width:96px; } }
  @keyframes article-in { from { opacity:0; transform:translateY(14px); filter:blur(5px); } }
  .article-meta { display:flex; flex-wrap:wrap; gap:14px; align-items:center; color:#9a9a9a; font-size:13.5px; margin-bottom:34px; animation:article-in .7s ease-out .12s backwards; }
  .article-body p, .article-body .code-wrap, .article-body > img, .article-body h1, .article-body h2, .article-body h3, .article-body h4, .article-body blockquote, .article-body ul, .article-body ol {
    opacity:0; transform:translateY(14px);
    transition:opacity .6s ease, transform .6s ease, background-color .6s ease, box-shadow .6s ease;
  }
  .article-body p.in, .article-body .code-wrap.in, .article-body > img.in, .article-body h1.in, .article-body h2.in, .article-body h3.in, .article-body h4.in, .article-body blockquote.in, .article-body ul.in, .article-body ol.in { opacity:1; transform:none; }
  /* 阅读中高亮：段落进入视口短暂亮起 */
  .article-body p.reading {
    background:var(--accent-soft);
    box-shadow:0 0 0 8px var(--accent-soft);
    border-radius:6px;
  }
  .article-body p { margin-bottom:20px; color:var(--ink); font-size:16px; line-height:1.9; }
  /* 文章图片（markdown-it 与内置解析统一按块级大图展示） */
  .article-body > img,
  .article-body p img {
    display:block; max-width:100%; height:auto;
    border-radius:10px; margin:24px auto;
    box-shadow:0 8px 24px rgba(26,26,26,.10);
  }
  /* Markdown 元素 */
  .article-body h1 { font-size:24px; margin:34px 0 12px; }
  .article-body h2 { font-size:21px; margin:30px 0 10px; }
  .article-body h3 { font-size:18px; margin:26px 0 8px; }
  .article-body h4 { font-size:16px; margin:22px 0 6px; }
  .article-body ul, .article-body ol { margin:0 0 20px; padding-left:26px; color:var(--ink); }
  .article-body li { margin-bottom:6px; line-height:1.8; }
  .article-body blockquote {
    margin:0 0 20px; padding:12px 18px;
    border-left:3px solid var(--accent); background:var(--accent-soft);
    border-radius:0 8px 8px 0; color:var(--muted); font-size:15px;
  }
  .inline-code {
    background:var(--accent-soft); color:var(--accent);
    padding:2px 6px; border-radius:5px; font-size:.9em;
    font-family:"JetBrains Mono", "Cascadia Code", Consolas, "Noto Sans SC", "Microsoft YaHei", monospace;
  }
  .article-body a { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
  .article-body a:hover { opacity:.8; }
  /* 表格（markdown-it） */
  .article-body table { width:100%; border-collapse:collapse; margin:0 0 22px; font-size:14.5px; }
  .article-body th, .article-body td { border:1px solid var(--line); padding:9px 13px; text-align:left; }
  .article-body th { background:var(--bg-soft); font-weight:700; }
  .article-body tbody tr:nth-child(even) td { background:var(--bg-soft); }
  .article-body hr { border:none; border-top:1px solid var(--line); margin:30px 0; }
  .article-body del, .article-body s { color:var(--muted); }
  .article-body blockquote p { margin:0 0 8px; }
  .article-body blockquote p:last-child { margin-bottom:0; }

  /* ===== Toast ===== */
  .toast-wrap { position:fixed; top:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:10px; }
  .toast {
    padding:13px 20px; border-radius:12px; font-size:14px; font-weight:500;
    background:var(--inverse); color:var(--inverse-text);
    background:var(--ink); box-shadow:0 8px 24px rgba(26,26,26,.2);
    animation:toast-in .35s cubic-bezier(.2,.9,.3,1.2), toast-out .3s ease forwards;
  }
  .toast.out { animation:toast-out .3s ease forwards; }
  @keyframes toast-in { from { opacity:0; transform:translateX(60px); } to { opacity:1; transform:none; } }
  @keyframes toast-out { to { opacity:0; transform:translateX(60px); } }
  .toast.ok { background:#1e7e4a; }
  .toast.err { background:#b3261e; }

  /* ===== 搜索：图标右移 + 输入框滑出 ===== */
  .search-box { position:relative; display:flex; align-items:center; gap:6px; margin-left:4px; }
  .search-input {
    width:0; opacity:0; padding:7px 2px;
    border:none; border-bottom:1.5px solid var(--line);
    background:transparent; font-size:14px; font-family:inherit; color:var(--ink);
    outline:none;
    transition:width .32s cubic-bezier(.2,.7,.3,1), opacity .25s ease, border-color .2s ease;
  }
  .search-box.open .search-input { width:190px; opacity:1; border-bottom-color:var(--accent); }
  .search-toggle {
    width:38px; height:36px; border:none; border-radius:10px; cursor:pointer;
    background:transparent; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    transition:transform .32s cubic-bezier(.2,.7,.3,1), background-color .18s ease;
  }
  .search-toggle:hover { background:var(--bg-soft); }
  .search-toggle svg { width:18px; height:18px; }
  .search-results {
    position:absolute; top:calc(100% + 10px); right:0; width:300px; max-height:320px; overflow-y:auto;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 16px 40px rgba(26,26,26,.14);
    opacity:0; transform:translateY(-6px); pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:300;
  }
  .search-results.show { opacity:1; transform:none; pointer-events:auto; }
  .search-item { display:block; padding:11px 16px; border-bottom:1px solid var(--line); transition:background-color .15s ease; }
  .search-item:last-child { border-bottom:none; }
  .search-item:hover { background:var(--bg-soft); }
  .si-title { display:block; font-size:14px; font-weight:600; }
  .si-date { font-size:11.5px; color:var(--muted); }
  .search-empty { padding:16px; font-size:13.5px; color:var(--muted); text-align:center; }
  @media (max-width:640px) { .search-box.open .search-input { width:120px; } }

  /* ===== 语言切换按钮 + 点击波纹 ===== */
  .lang-toggle {
    width:44px; height:36px; border:none; border-radius:999px; cursor:pointer;
    background:var(--inverse); color:var(--inverse-text); font-size:13.5px; font-weight:700;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .lang-toggle:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(26,26,26,.22); }
  .ripple-btn { position:relative; overflow:hidden; }
  .ripple-btn .ripple {
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.5);
    animation:ripple var(--duration, 0.6s);
  }
  @keyframes ripple { to { transform:scale(4); opacity:0; } }
  /* 主题切换按钮 */
  .theme-toggle {
    width:38px; height:36px; border:none; border-radius:10px; cursor:pointer;
    background:transparent; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    transition:background-color .18s ease, color .18s ease;
  }
  .theme-toggle:hover { background:var(--bg-soft); }
  .theme-toggle svg { width:18px; height:18px; }

  /* ===== 暗夜主题组件覆盖 ===== */
  html[data-theme="dark"] .topbar { background:rgba(18,20,25,.86); border-bottom-color:var(--line); }
  html[data-theme="dark"] .topbar.scrolled { box-shadow:0 4px 20px rgba(0,0,0,.4); }
  html[data-theme="dark"] .search-input { color:var(--ink); border-bottom-color:var(--line); }
  html[data-theme="dark"] .search-results { background:var(--modal-bg); border-color:var(--line); box-shadow:0 16px 40px rgba(0,0,0,.5); }
  html[data-theme="dark"] .search-item:hover { background:var(--bg-soft); }
  html[data-theme="dark"] .modal-box { background:var(--modal-bg); color:var(--ink); }
  html[data-theme="dark"] .modal-overlay { background:var(--overlay); }
  html[data-theme="dark"] .back-top { background:var(--inverse); color:var(--inverse-text); }
  html[data-theme="dark"] .footer { background:var(--bg-soft); border-top-color:var(--line); }
  html[data-theme="dark"] .progress-bar { background:var(--accent); }
  html[data-theme="dark"] .card:hover, html[data-theme="dark"] .git-card:hover { border-color:#3a4150; }

  .git-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
  .git-card {

    background:var(--card);

  .git-name:hover { text-decoration:underline; text-underline-offset:3px; }
  .git-desc { margin-top:8px; font-size:13.5px; color:var(--muted); line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .git-meta { margin-top:14px; display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }

  .lang-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* ===== 文章代码块：深色专业样式 + 轻量语法高亮 ===== */
  .code-block {
    position:relative;
    background:var(--code-bg); color:var(--code-text);
    border-radius:12px; padding:20px 20px 18px;
    overflow-x:auto; font-size:14.5px; line-height:1.75; text-rendering:optimizeLegibility;
    /* 圆润等宽：JetBrains Mono 本地优先，Cascadia/Fira 次之，Consolas 兜底 */
    font-family:"JetBrains Mono", "Cascadia Code", "Fira Code", "SF Mono", Menlo, Consolas, "Noto Sans SC", "Microsoft YaHei", monospace;
    font-variant-ligatures:contextual;
    margin:24px 0;
    tab-size:4;
  }
  /* 语言角标与复制按钮改由 .code-wrap 定位（固定在框角，不随横向滚动） */
  /* 代码块 hover 发光 + 复制按钮 */
  .code-block { transition:box-shadow .25s ease, transform .25s ease; }
  .code-block:hover { box-shadow:0 12px 32px rgba(15,23,42,.28); transform:translateY(-2px); }
  .copy-btn {
    font-size:11px; font-weight:600; color:#94a3b8;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:6px; padding:4px 10px; cursor:pointer;
    font-family:"SF Pro Text", "Noto Sans SC", system-ui, sans-serif;
    transition:color .2s ease, background-color .2s ease, transform .18s ease;
  }
  .copy-btn:hover { color:#e2e8f0; background:rgba(255,255,255,.12); }
  .copy-btn:active { transform:scale(.94); }
  .hl-kw  { color:#c792ea; }   /* 关键字 */
  .hl-str { color:#a5d6a7; }   /* 字符串与字符 */
  .hl-cmt { color:#64748b; font-style:italic; }  /* 注释 */
  .hl-num { color:#f78c6c; }   /* 数字 */
  .hl-pre { color:#82aaff; }   /* 预处理指令 */

    transition:opacity .3s ease, transform .3s ease, box-shadow .3s ease;
    font-family:"SF Pro Text", "Noto Sans SC", system-ui, sans-serif;
  }
  .back-top.show { opacity:1; transform:none; pointer-events:auto; }
  .back-top:hover { transform:translateY(-3px); box-shadow:0 12px 26px rgba(26,26,26,.3); }
  .back-top:active { transform:scale(.94); }

  .footer-h { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .footer-nav a, .footer-social a {
    display:block; font-size:14px; color:var(--muted); padding:5px 0;

  .footer-bottom {
    margin-top:40px; padding-top:20px;
    border-top:1px solid var(--line);
    font-size:12.5px; color:#9a9a9a;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  /* ===== 公告弹窗 ===== */
  .announce-overlay {
    position:fixed; inset:0; z-index:500;
    background:var(--overlay);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .announce-overlay.show { opacity:1; pointer-events:auto; }
  .announce-box {
    background:var(--modal-bg); color:var(--ink);
    border:1px solid var(--line); border-radius:14px;
    max-width:460px; width:100%; max-height:82vh; overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    transform:translateY(14px) scale(.98);
    transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .announce-overlay.show .announce-box { transform:none; }
  .announce-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
  }
  .announce-head h3 { font-size:16px; font-weight:700; }
  .announce-date { font-size:12px; color:var(--muted); margin-left:10px; }
  .announce-close {
    width:30px; height:30px; border:none; border-radius:8px; cursor:pointer;
    background:transparent; color:var(--muted); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:background-color .15s ease, color .15s ease;
  }
  .announce-close:hover { background:var(--bg-soft); color:var(--ink); }
  .announce-body { padding:18px 20px 20px; font-size:14.5px; line-height:1.8; color:var(--ink); white-space:pre-line; }
  .announce-foot { padding:0 20px 18px; }
  .announce-check {
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); cursor:pointer;
  }
  .announce-check input { accent-color:var(--accent); cursor:pointer; }

  /* ===== 404 页 ===== */
  .nf { text-align:center; padding:140px 0 120px; }
  .nf-code {
    font-size:clamp(96px, 18vw, 180px); font-weight:800; line-height:1;
    letter-spacing:-.04em;
    background:linear-gradient(120deg, var(--accent), #4a7bb5);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:nf-in .8s cubic-bezier(.2,.7,.3,1.4) backwards;
  }
  .nf h2 { font-size:clamp(22px, 3vw, 30px); margin:18px 0 10px; }
  .nf p { color:var(--muted); margin-bottom:30px; }

  /* ===== 键盘可达性：焦点轮廓 ===== */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* ===== 打印样式：正文干净可打印 ===== */
  @media print {
    .topbar, .back-top, .progress-bar, .toast-wrap, .copy-btn, .hero-scroll-hint, .footer { display:none !important; }

  /* ===== 移动端 ===== */
  @media (max-width:640px) {
    .topbar { padding:12px 14px; gap:8px; }
    .container { padding:0 18px; }
    .nav a { padding:6px 10px; font-size:13px; }

    .footer-bottom { flex-direction:column; gap:6px; }
    .search-results { width:min(78vw, 300px); }
    .back-top { right:14px; bottom:20px; }
    .below { padding:60px 0 70px; }
  }

  /* ===== 内联自定义样式（与 assets/blog.css 同步，确保生效）===== */
/* 代码块 / 行内代码字体（系统等宽兜底，保证任何环境都清晰） */
.code-block, .code-block code, .inline-code {
  font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", monospace;

}
/* ===== 代码块外框（复制按钮与语言角标固定在框角，不随横向滚动移动）===== */
.code-wrap { position: relative; margin: 24px 0; }
.code-wrap > .code-block { margin: 0; }
.code-wrap::before {

}
.code-wrap > .copy-btn { position: absolute; top: 10px; right: 14px; z-index: 2; }

/* ===== 文章页宽度（可自行调整此数值）===== */
.article { max-width: 940px; }
/* ===== 图片点击放大预览（lightbox）===== */
.article-body img { cursor: zoom-in; }
.lightbox {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(8, 10, 14, .92);
  display: flex; align-items: center; justify-content: center;
  padding: 40px 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.lightbox.show { opacity: 1; pointer-events: auto; }
.lightbox img {
  max-width: 100%; max-height: 100%;
  border-radius: 8px; box-shadow: 0 24px 60px rgba(0,0,0,.6);
  transform: scale(.94); transition: transform .3s cubic-bezier(.2,.7,.3,1);
  cursor: zoom-out;
}
.lightbox.show img { transform: none; }
.lightbox-close {
  position: absolute; top: 18px; right: 20px;
  width: 40px; height: 40px; border: none; border-radius: 50%; cursor: pointer;
  background: rgba(255,255,255,.12); color: #fff; font-size: 20px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background-color .18s ease, transform .18s ease;
}
.lightbox-close:hover { background: rgba(255,255,255,.24); transform: scale(1.06); }
.lightbox-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px; border: none; border-radius: 50%; cursor: pointer;
  background: rgba(255,255,255,.12); color: #fff; font-size: 22px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background-color .18s ease, opacity .18s ease;
}
.lightbox-nav:hover { background: rgba(255,255,255,.26); }
.lightbox-nav.prev { left: 18px; }
.lightbox-nav.next { right: 18px; }
.lightbox-nav[hidden] { display: none; }
.lightbox-count {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.75); font-size: 13px; letter-spacing: .04em;
}
body.lightbox-open { overflow: hidden; }
@media (max-width: 640px) {
  .lightbox { padding: 24px 12px; }
  .lightbox-nav { width: 40px; height: 40px; font-size: 18px; }
  .lightbox-nav.prev { left: 8px; }
  .lightbox-nav.next { right: 8px; }
}

      canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = 'rgb(31, 58, 95)';
      buildGrid();
    }
    function stop() { running = false; cancelAnimationFrame(rafId); }
    function wake() { if (!running) { running = true; rafId = requestAnimationFrame(tick); } }

    function tick(now) {
      rafId = requestAnimationFrame(tick);
      if (!visible || now - last < FRAME) return;
      last = now - (now - last) % FRAME;
      var cw = canvas.clientWidth, ch = canvas.clientHeight;
      if (cw !== w || ch !== h) {
        w = cw; h = ch;
        canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        clearTimeout(rebuildTimer); rebuildTimer = setTimeout(buildGrid, 150);
      }
      ctx.clearRect(0, 0, w, h);
      var totalV = 0;
      for (var i = 0; i < points.length; i++) {
        var p = points[i];
        var dx = p.x - mouseX, dy = p.y - mouseY, d = Math.sqrt(dx * dx + dy * dy);
        if (d < PUSH_R && d > 0.1) {
          var f = (1 - d / PUSH_R) * 30;
          p.vx += (dx / d) * f * PUSH_K; p.vy += (dy / d) * f * PUSH_K;
        }
        p.vx += (p.restX - p.x) * SPRING; p.vy += (p.restY - p.y) * SPRING;
        p.vx *= DAMP; p.vy *= DAMP;
        p.x += p.vx; p.y += p.vy;
        totalV += Math.abs(p.vx) + Math.abs(p.vy);
        var size = 1.8, alpha = 0.2;
        if (d < PUSH_R) {
          var l = Math.max(0, 1 - d / PUSH_R);
          size = 1.8 + 2 * l; alpha = 0.2 + 0.4 * l;
        }
        ctx.globalAlpha = alpha;
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
      }
      ctx.globalAlpha = 1;
      if (totalV < 0.01 && mouseX !== mouseX) stop();
    }

    window.addEventListener('mousemove', function (e) {
      var r = canvas.getBoundingClientRect();
      mouseX = e.clientX - r.left; mouseY = e.clientY - r.top;
      wake();
    });
    canvas.addEventListener('mouseleave', function () { mouseX = NaN; mouseY = NaN; });
    var io = new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      if (visible) wake(); else stop();
    }, { threshold: 0 });
    io.observe(canvas);

    resize(); wake();
    window.addEventListener('resize', resize);
    particleState = { stop: function () { io.disconnect(); stop(); }, resize: resize };
  }

  var GIT_LANG_COLORS = {
    'JavaScript': '#f1e05a', 'TypeScript': '#3178c6', 'Python': '#3572A5', 'C': '#555555',
    'C++': '#f34b7d', 'Java': '#b07219', 'Go': '#00ADD8', 'Rust': '#dea584',

  function fetchGitHub() {
    var gh = getSite().github;
    var grid = document.getElementById('gitGrid');
    if (!gh || !grid) return;
    grid.innerHTML = '';
    fetch('https://api.github.com/users/' + encodeURIComponent(gh) + '/repos?sort=updated&per_page=100', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json();
      })
      .then(function (repos) {
        var list = (Array.isArray(repos) ? repos : []).filter(function (r) { return !r.fork; }).slice(0, 6);
        if (!list.length) { grid.innerHTML = '<p class="empty">' + t('gitEmpty') + '</p>'; return; }
        grid.innerHTML = list.map(function (r, i) {
          var lang = r.language || '';
          var color = GIT_LANG_COLORS[lang] || '#8b949e';
          var stars = r.stargazers_count || 0;
          var forks = r.forks_count || 0;
          var date = (r.updated_at || '').slice(0, 10);
          return '<div class="git-card" data-reveal style="--reveal-delay:' + (i * 60) + 'ms">' +
            '<a class="git-name" href="' + esc(r.html_url) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a>' +
            (r.description ? '<p class="git-desc">' + esc(r.description) + '</p>' : '') +
            '<div class="git-meta">' +
              (lang ? '<span class="lang"><span class="lang-dot" style="background:' + color + '"></span>' + esc(lang) + '</span>' : '') +
              '<span>★ ' + stars + '</span>' +
              '<span>⑂ ' + forks + '</span>' +
              '<span>' + date + '</span>' +
            '</div>' +
          '</div>';
        }).join('');
        bindReveals();
      })
      .catch(function () {
        grid.innerHTML = '<p class="empty">' + t('gitLoadFail') + '</p>';
      });
  }

  /* ================= 图片点击放大预览 ================= */
  var lbImages = [];
  var lbIndex = 0;
  var lbEl = null;
  function collectImages() {
    lbImages = Array.prototype.slice.call(document.querySelectorAll('.article-body img'));
  }
  function buildLightbox() {
    if (lbEl) return lbEl;
    var el = document.createElement('div');
    el.className = 'lightbox';
    el.innerHTML =
      '<button type="button" class="lightbox-close" aria-label="close">✕</button>' +
      '<button type="button" class="lightbox-nav prev" aria-label="prev">‹</button>' +
      '<img alt="">' +
      '<button type="button" class="lightbox-nav next" aria-label="next">›</button>' +
      '<div class="lightbox-count"></div>';
    document.body.appendChild(el);
    el.addEventListener('click', function (e) {
      var t = e.target;
      if (t === el || t.classList.contains('lightbox-close') || t.classList.contains('lightbox-img-zoom')) closeLightbox();
      else if (t.classList.contains('prev')) stepImage(-1);
      else if (t.classList.contains('next')) stepImage(1);
    });
    lbEl = el;
    return el;
  }
  function renderLightbox() {
    var img = lbEl.querySelector('img');
    var src = lbImages[lbIndex];
    if (!src) return;
    img.src = src.getAttribute('src');
    img.alt = src.getAttribute('alt') || '';
    var multi = lbImages.length > 1;
    lbEl.querySelector('.prev').hidden = !multi;
    lbEl.querySelector('.next').hidden = !multi;
    lbEl.querySelector('.lightbox-count').textContent = multi ? (lbIndex + 1) + ' / ' + lbImages.length : '';
  }
  function openLightbox(target) {
    collectImages();
    var i = lbImages.indexOf(target);
    if (i < 0) return;
    lbIndex = i;
    buildLightbox();
    renderLightbox();
    document.body.classList.add('lightbox-open');
    requestAnimationFrame(function () { lbEl.classList.add('show'); });
  }
  function closeLightbox() {
    if (!lbEl) return;
    lbEl.classList.remove('show');
    document.body.classList.remove('lightbox-open');
    setTimeout(function () {
      if (lbEl && !lbEl.classList.contains('show')) lbEl.querySelector('img').removeAttribute('src');
    }, 250);
  }
  function stepImage(dir) {
    if (!lbImages.length) return;
    lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
    renderLightbox();
  }
  /* 事件委托：正文图片点击放大 */
  document.addEventListener('click', function (e) {

  });
  /* 键盘：ESC 关闭，左右切换 */
  document.addEventListener('keydown', function (e) {
    if (!lbEl || !lbEl.classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') stepImage(-1);
    else if (e.key === 'ArrowRight') stepImage(1);
  });
  /* 路由切换时关闭预览 */
  window.addEventListener('hashchange', function () { if (lbEl && lbEl.classList.contains('show')) closeLightbox(); });

  /* ================= 路由 ================= */
  function route() {
    var hash = location.hash || '#/';
    var path = hash.split('?')[0];
    var routePath = path.replace(/^#\/?/, '');  // 去掉 # 与前导斜杠
    var parts = routePath.split('/').filter(Boolean);  // ['articles'] | ['article','id']
    document.querySelectorAll('.nav a').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === path);
    });
    unmountHeroFx();
    document.getElementById('progressBar').style.display = 'none';
    var backTopEl = document.getElementById('backTop');
    if (backTopEl) backTopEl.classList.remove('show');
    if (parts.length === 0 || parts[0] === 'home') renderHome();
    else if (parts[0] === 'articles') renderArticles();
    else if (parts[0] === 'article' && parts[1]) renderArticle(decodeURIComponent(parts[1]));
    else renderNotFound();
  }

  window.addEventListener('hashchange', route);
  bindTopbar();
  var footerYearEl = document.getElementById('footerYear');
  if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();
  applyLang();
  Promise.all([initData(), initSite()]).then(function () {
    renderFooterSocials();
    route();
    // 加载公告配置并弹窗（需先加载 announcement.js，非 file:// 也能加载——file:// 下 script 可行）
    loadScript('data/announcement.js').then(function () {
      if (shouldShowAnnounce()) buildAnnounce();
    }).catch(function () { /* 无公告文件则不弹 */ });
  });   // 数据与站点配置就绪后再渲染
})();
</script>
</body>
</html>
